[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "budget-tracker-backend"
version = "0.1.0"
description = "Private household budget tracker API"
requires-python = ">=3.13,<3.15"
dependencies = [
    "alembic==1.19.2",
    "argon2-cffi==25.1.0",
    "fastapi==0.141.1",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.52",
    "uvicorn==0.52.4",
]

[project.optional-dependencies]
test = [
    "httpx==0.28.1",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
